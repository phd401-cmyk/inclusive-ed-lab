<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Template Repository — Inclusive Ed Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f6f4ef; --bg-2:#efebe0; --surface:#ffffff; --surface-2:#fbf9f4;
    --ink:#1a1a1a; --ink-2:#4b4742; --ink-3:#8a847b; --ink-4:#b8b2a7;
    --border:#e6e0d2; --border-strong:#d4cdb9;
    --accent:#d97757; --accent-ink:#fff; --accent-soft:#f5e2d7;
    --accent-2:#4a7a8c; --accent-2-soft:#dde8ec;
    --good:#4f7d52; --good-soft:#dbe6dc;
    --warn:#b8862a; --warn-soft:#f3e5c0;
    --radius:10px; --radius-lg:18px;
    --shadow-1:0 1px 0 rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.04);
    --shadow-2:0 1px 0 rgba(0,0,0,.05),0 8px 24px -10px rgba(40,30,20,.18);
    --shadow-3:0 1px 0 rgba(0,0,0,.05),0 24px 60px -20px rgba(40,30,20,.35);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4 { margin:0; font-weight:600; letter-spacing:-0.015em; }
  h1 { font-size:40px; line-height:1.08; letter-spacing:-0.025em; }
  p { line-height:1.6; color:var(--ink-2); }
  .serif { font-family:'Instrument Serif',Georgia,serif; }
  .mono  { font-family:'JetBrains Mono',ui-monospace,monospace; }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-3);
    text-transform:uppercase; letter-spacing:0.1em; }
  .lede { font-size:17px; color:var(--ink-2); line-height:1.55; max-width:60ch; }
  .btn { border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);
    padding:10px 16px; border-radius:8px; font-size:14px; font-weight:500; font-family:inherit;
    display:inline-flex; align-items:center; gap:8px; cursor:pointer; line-height:1;
    transition:background .12s,transform .08s; }
  .btn:hover { background:var(--bg-2); }
  .btn:active { transform:translateY(1px); }
  .btn.accent { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.accent:hover { background:#c96544; }
  .btn.ghost { background:transparent; border-color:transparent; }
  .btn.ghost:hover { background:var(--bg-2); }
  .btn.sm { padding:6px 10px; font-size:12.5px; border-radius:6px; }
  .input { border:1px solid var(--border-strong); background:var(--surface); border-radius:8px;
    padding:10px 12px; font-size:14px; color:var(--ink); outline:none; width:100%;
    font-family:inherit; transition:border-color .15s,box-shadow .15s; }
  .input:focus { border-color:var(--ink); box-shadow:0 0 0 3px rgba(217,119,87,.18); }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:5px 10px;
    border-radius:999px; border:1px solid var(--border-strong); font-size:12px;
    background:var(--surface); color:var(--ink-2); cursor:pointer; user-select:none;
    line-height:1; font-family:inherit; }
  .chip:hover { background:var(--bg-2); }
  .chip.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .chip.theory { font-family:'JetBrains Mono',monospace; font-size:10.5px;
    text-transform:uppercase; letter-spacing:.04em; background:var(--accent-soft);
    color:#8c4a2e; border-color:transparent; }
  .chip.theory.alt { background:var(--accent-2-soft); color:#345766; border-color:transparent; }
  .badge { display:inline-flex; align-items:center; font-size:11px; font-weight:600;
    padding:3px 7px; border-radius:4px; background:var(--bg-2); color:var(--ink-2);
    text-transform:uppercase; letter-spacing:.05em; }
  .badge.good { background:var(--good-soft); color:var(--good); }
  .badge.warn { background:var(--warn-soft); color:var(--warn); }
  .tpl-card { border:1px solid var(--border); background:var(--surface); border-radius:14px;
    overflow:hidden; cursor:pointer; display:flex; flex-direction:column;
    transition:transform .15s,border-color .12s,box-shadow .15s; }
  .tpl-card:hover { transform:translateY(-2px); border-color:var(--ink-3);
    box-shadow:var(--shadow-2); }
  .tpl-card.selected { border-color:var(--ink); box-shadow:0 0 0 1px var(--ink) inset; }
  .mt-2 { margin-top:16px; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none} }
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}
  @media(max-width:860px){
    body { font-size:14px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="repo-data.jsx"></script>
<script type="text/babel" src="repo-thumbs.jsx"></script>
<script type="text/babel" src="repo-app.jsx"></script>
</body>
</html>

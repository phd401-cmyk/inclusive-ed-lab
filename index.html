<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Inclusive Ed Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --bg-2: #f7f3fc; --surface: #ffffff; --surface-2: #fcfaff;
    --ink: #0d0d0d; --ink-2: #2e2040; --ink-3: #7a6e88; --ink-4: #b8aec8;
    --border: #e8e0f0; --border-strong: #d4c8e8;
    --accent: #6B2FA0; --accent-ink: #fff; --accent-soft: #f0e8f8;
    --accent-2: #d97757; --accent-2-soft: #fdf0eb;
    --warn: #b8862a; --warn-soft: #f3e5c0;
    --good: #4f7d52; --good-soft: #dbe6dc;
    --radius: 10px; --radius-lg: 18px; --radius-sm: 6px;
    --shadow-1: 0 1px 0 rgba(107,47,160,.04), 0 1px 3px rgba(107,47,160,.06);
    --shadow-2: 0 1px 0 rgba(107,47,160,.04), 0 6px 24px -8px rgba(107,47,160,.14);
    --shadow-3: 0 1px 0 rgba(107,47,160,.05), 0 20px 60px -16px rgba(107,47,160,.28);
  }
  [data-theme="dark"] {
    --bg: #100c18; --bg-2: #1a1425; --surface: #1e1630; --surface-2: #261d38;
    --ink: #f0ecf8; --ink-2: #c8bede; --ink-3: #8878a8; --ink-4: #54496a;
    --border: #2e2445; --border-strong: #3e3258;
    --accent: #9b5fd0; --accent-ink: #fff; --accent-soft: #2a1840;
    --accent-2: #e08a6b; --accent-2-soft: #3a2b21;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: 'Work Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  h1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -0.015em; }
  h1 { font-size: 36px; line-height: 1.1; letter-spacing: -0.02em; }
  h2 { font-size: 22px; line-height: 1.2; }
  h3 { font-size: 17px; }
  h4 { font-size: 14px; }
  p { line-height: 1.6; color: var(--ink-2); margin: 0; }
  a { color: var(--accent); }
  .serif { font-family: 'Instrument Serif', Georgia, serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.1em; }
  .lede { font-size: 16px; color: var(--ink-2); line-height: 1.55; }
  .muted { color: var(--ink-3); }
  .mt-1 { margin-top: 8px; } .mt-2 { margin-top: 16px; } .mt-3 { margin-top: 24px; } .mt-4 { margin-top: 32px; }
  .mb-1 { margin-bottom: 8px; } .mb-2 { margin-bottom: 16px; } .mb-3 { margin-bottom: 24px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .col { display: flex; flex-direction: column; }
  .between { justify-content: space-between; }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  /* Buttons */
  .btn { border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
    padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; font-family: inherit;
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; line-height: 1;
    transition: background .12s, transform .08s, box-shadow .12s; }
  .btn:hover { background: var(--bg-2); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .45; pointer-events: none; }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.primary:hover { background: var(--ink-2); }
  .btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.accent:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--bg-2); }
  .btn.outline-accent { border-color: var(--accent); color: var(--accent); background: transparent; }
  .btn.outline-accent:hover { background: var(--accent-soft); }
  .btn.lg { padding: 12px 22px; font-size: 15px; border-radius: 10px; }
  .btn.sm { padding: 6px 10px; font-size: 12.5px; border-radius: 6px; }

  /* Form */
  .input, .select, .textarea { border: 1px solid var(--border-strong); background: var(--surface);
    border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--ink);
    outline: none; width: 100%; font-family: inherit; transition: border-color .15s, box-shadow .15s; }
  .input:focus, .select:focus, .textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .textarea { min-height: 88px; resize: vertical; }
  .select { appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(107,47,160,.6)' d='M0 0h10L5 6z'/></svg>");
    background-repeat: no-repeat; background-position: right 12px center; padding-right: 32px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field-label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .field-help { font-size: 12px; color: var(--ink-3); }

  /* Chips */
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
    border-radius: 999px; border: 1px solid var(--border-strong); font-size: 13px;
    background: var(--surface); color: var(--ink-2); cursor: pointer; user-select: none;
    line-height: 1; font-family: inherit; transition: background .1s; }
  .chip:hover { background: var(--bg-2); }
  .chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip.theory { font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
    text-transform: uppercase; letter-spacing: .04em;
    background: var(--accent-soft); color: #55247e; border-color: transparent; }
  .chip.theory.alt { background: var(--accent-2-soft); color: #8c4a2e; border-color: transparent; }

  /* Badge */
  .badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600;
    padding: 3px 7px; border-radius: 4px; background: var(--bg-2); color: var(--ink-2);
    text-transform: uppercase; letter-spacing: .05em; }
  .badge.good { background: var(--good-soft); color: var(--good); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-1); }
  .card.elevated { box-shadow: var(--shadow-2); }
  .surface-quiet { background: var(--bg-2); border-radius: var(--radius); border: 1px solid var(--border); }

  /* TLM tiles */
  .tlm-tile { background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius-lg); padding: 18px; display: flex; flex-direction: column;
    gap: 10px; cursor: pointer; text-align: left; font-family: inherit;
    transition: border-color .15s, box-shadow .15s, transform .12s; }
  .tlm-tile:hover { border-color: var(--accent); box-shadow: var(--shadow-2); transform: translateY(-1px); }
  .tlm-tile.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .tlm-tile .icon { width: 36px; height: 36px; border-radius: 9px; background: var(--bg-2);
    border: 1px solid var(--border); display: grid; place-items: center; color: var(--ink-3); }
  .tlm-tile h4 { font-size: 14px; color: var(--ink); }
  .tlm-tile p { font-size: 12.5px; color: var(--ink-3); margin: 0; }

  /* Template cards */
  .tpl-card { border: 1px solid var(--border); background: var(--surface); border-radius: 14px;
    overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
    transition: transform .15s, border-color .12s, box-shadow .15s; }
  .tpl-card:hover { transform: translateY(-2px); border-color: var(--ink-3); box-shadow: var(--shadow-2); }
  .tpl-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .tpl-thumb { aspect-ratio: 160/220; background: white; border-bottom: 1px solid var(--border); overflow: hidden; }
  .tpl-meta { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }

  /* Grids */
  .grid-tlm { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .grid-tpl { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
  .grid-persona { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

  /* App shell */
  .app-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar { background: var(--bg-2); border-right: 1px solid var(--border);
    padding: 20px 16px; display: flex; flex-direction: column; gap: 20px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--ink);
    display: grid; place-items: center; color: var(--bg);
    font-family: 'Instrument Serif', serif; font-size: 20px;
    position: relative; flex-shrink: 0; }
  .brand-mark::after { content:''; position: absolute; right: -3px; bottom: -3px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .brand-name { font-weight: 700; font-size: 14px; line-height: 1.2; }
  .brand-name small { display: block; font-size: 10.5px; color: var(--ink-3); font-weight: 400; }
  .sidebar-section-label { font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; color: var(--ink-3); }
  .progress-list { display: flex; flex-direction: column; gap: 2px; }
  .progress-step { display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: 8px; font-size: 13.5px; cursor: pointer; transition: background .1s; }
  .progress-step:hover { background: var(--border); }
  .progress-step.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .progress-step.done { color: var(--ink-3); }
  .progress-step.locked { opacity: .4; pointer-events: none; }
  .step-bullet { width: 22px; height: 22px; border-radius: 50%; background: var(--bg);
    border: 1.5px solid var(--border); display: grid; place-items: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .progress-step.active .step-bullet { background: var(--accent); border-color: var(--accent); color: #fff; }
  .progress-step.done .step-bullet { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .sidebar-foot { margin-top: auto; font-size: 11.5px; color: var(--ink-3); line-height: 1.6; }

  /* Topbar */
  .topbar { height: 54px; border-bottom: 1px solid var(--border); background: var(--bg);
    display: flex; align-items: center; padding: 0 28px; gap: 16px;
    position: sticky; top: 0; z-index: 10; }

  /* Step pills */
  .step-pills { display: flex; align-items: center; gap: 0; }
  .step-pill { display: flex; align-items: center; gap: 6px; font-size: 12.5px;
    padding: 5px 10px; border-radius: 999px; color: var(--ink-3); font-weight: 500; transition: color .15s; }
  .step-pill.active { color: var(--accent); font-weight: 700; }
  .step-pill.done { color: var(--ink-3); }
  .step-pill .num { width: 18px; height: 18px; border-radius: 50%; background: var(--bg-2);
    display: grid; place-items: center; font-size: 10px; font-weight: 700; border: 1px solid var(--border); }
  .step-pill.active .num { background: var(--accent); border-color: var(--accent); color: #fff; }
  .step-pill.done .num { background: var(--good-soft); border-color: var(--good); color: var(--good); font-size: 10px; }
  .step-pills .bar { width: 24px; height: 1px; background: var(--border); }

  /* Content */
  .app-main { display: flex; flex-direction: column; min-width: 0; }
  .content { padding: 32px 40px 80px; flex: 1; max-width: 1100px; }

  /* Pill toggle */
  .pill-toggle { display: flex; background: var(--bg-2); border-radius: 8px; padding: 3px; gap: 0; }
  .pill-toggle button { border: none; background: transparent; padding: 5px 14px;
    border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: inherit; color: var(--ink-3); transition: background .12s, color .12s; }
  .pill-toggle button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

  /* Dropzone */
  .dropzone { display: block; border: 2px dashed var(--border-strong); border-radius: var(--radius-lg);
    padding: 48px 32px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s; background: var(--surface); }
  .dropzone:hover { border-color: var(--accent); background: var(--accent-soft); }

  /* Doc canvas */
  .doc-canvas { background: var(--bg-2); border-radius: var(--radius-lg);
    padding: 24px; min-height: 500px; }
  .doc-page { background: white; border-radius: 10px; padding: 40px 44px;
    box-shadow: var(--shadow-2); min-height: 600px; max-width: 680px; margin: 0 auto; }

  /* Tour / modals */
  .scrim { position: fixed; inset: 0; background: rgba(10,6,20,.6);
    display: grid; place-items: center; z-index: 1000;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .tour-modal { background: var(--surface); border-radius: 20px; overflow: hidden;
    width: min(780px, 92vw); box-shadow: var(--shadow-3); display: flex; flex-direction: column; }
  .tour-art { height: 240px; position: relative; overflow: hidden; background: var(--bg-2); }
  .tour-body { padding: 28px 32px 24px; display: flex; flex-direction: column; gap: 0; }
  .tour-dots { display: flex; gap: 6px; }
  .tour-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); transition: background .2s; }
  .tour-dot.active { background: var(--accent); }

  /* Theory panel */
  .theory-panel { position: fixed; inset: 0; background: var(--bg); z-index: 900;
    display: grid; grid-template-columns: 220px 1fr; overflow: hidden; }
  .theory-nav { background: var(--bg-2); border-right: 1px solid var(--border);
    padding: 20px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .theory-btn { border: none; background: transparent; text-align: left; padding: 9px 12px;
    border-radius: 8px; font-size: 13.5px; cursor: pointer; font-family: inherit;
    color: var(--ink-2); transition: background .1s; }
  .theory-btn:hover { background: var(--border); }
  .theory-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .theory-content { padding: 40px 48px; overflow-y: auto; }
  .theory-diagram { background: var(--bg-2); border-radius: var(--radius-lg);
    border: 1px solid var(--border); overflow: hidden; }
  .theory-in-practice { background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 20px 24px; }

  /* Animations */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .anim-fade { animation: fadeIn .3s ease both; }
  .spin { animation: spin 1s linear infinite; }
  .pulse { animation: pulse 1.4s ease infinite; }

  /* Density */
  [data-density="compact"] .content { padding: 20px 28px 64px; }
  [data-density="compact"] .card { padding: 16px; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }

  @media(max-width: 980px) {
    .app-shell { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .grid-tlm { grid-template-columns: repeat(2,1fr); }
    .grid-tpl { grid-template-columns: repeat(2,1fr); }
    .content { padding: 20px; }
  }
</style>
</head>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {

      <input type="range" className="twk-slider" min={min} max={max} step={step}

function TweakToggle({ label, value, onChange }) {

    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

const Button = ({ children, variant = 'default', size, leading, trailing, onClick, disabled, type = 'button', className = '' }) => {
  const cls = ['btn', variant === 'primary' ? 'primary' : variant === 'accent' ? 'accent' : variant === 'ghost' ? 'ghost' : '', size === 'lg' ? 'lg' : size === 'sm' ? 'sm' : '', className].filter(Boolean).join(' ');
  return (
    <button type={type} className={cls} onClick={onClick} disabled={disabled}>
      {leading && <Icon name={leading} size={size === 'lg' ? 16 : 14} />}
      {children}
      {trailing && <Icon name={trailing} size={size === 'lg' ? 16 : 14} />}
    </button>
  );
};

const Chip = ({ active, onClick, children, className = '', kind }) => (
  <button type="button" className={['chip', kind || '', active ? 'active' : '', className].filter(Boolean).join(' ')} onClick={onClick}>
    {children}
  </button>
);

const TheoryChip = ({ id, withName = true }) => {
  const t = THEORIES[id]; if (!t) return null;
  return <span className={'chip ' + t.klass} title={t.blurb}>{withName ? t.short : id}</span>;
};

const Badge = ({ children, tone }) => (
  <span className={'badge ' + (tone || '')}>{children}</span>
);

const Field = ({ label, help, children }) => (
  <div className="field">
    {label && <label className="field-label">{label}</label>}
    {children}
    {help && <div className="field-help">{help}</div>}
  </div>
);

const Card = ({ children, padded = true, className = '', elevated, ...rest }) => (
  <div className={['card', elevated ? 'elevated' : '', className].filter(Boolean).join(' ')} style={padded ? null : { padding: 0 }} {...rest}>
    {children}
  </div>
);

const SegmentToggle = ({ value, onChange, options }) => (
  <div className="pill-toggle">
    {options.map(o => (
      <button key={o.value} className={value === o.value ? 'on' : ''} onClick={() => onChange(o.value)}>{o.label}</button>
    ))}
  </div>
);

// Topbar step pills
const StepPills = ({ steps, current }) => (
  <div className="step-pills">
    {steps.map((s, i) => (
      <React.Fragment key={s.id}>
        <div className={'step-pill ' + (current === i ? 'active' : current > i ? 'done' : '')}>
          <span className="num">{current > i ? '✓' : i + 1}</span>
          <span>{s.label}</span>
        </div>
        {i < steps.length - 1 && <span className="bar" />}

);

// Template card placeholder thumb — uses SVG so no absolute-positioning fragility
const TemplateThumb = ({ tlm, name }) => {
  const colorFor = (str) => {
    let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360;
    // return a safe hsl (no oklch to avoid browser-support issues)
    return `hsl(${h},22%,82%)`;
  };
  const bg = colorFor(name);
  return (
    <div className="tpl-thumb">
      <svg viewBox="0 0 160 220" style={{ width:'100%', height:'100%', display:'block' }}>
        <rect width="160" height="220" fill="white"/>
        <rect x="0" y="0" width="160" height="20" fill={bg}/>
        <text x="80" y="13" textAnchor="middle" fill="rgba(0,0,0,0.5)" fontSize="7" fontFamily="system-ui" fontWeight="600" letterSpacing="0.5">
          {(tlm||'').toUpperCase().slice(0,18)}
        </text>
        <rect x="12" y="28" width="136" height="12" rx="2" fill={bg} opacity=".5"/>
        {[44,60,74,88,102,116].map((y,i) => (
          <rect key={i} x="12" y={y} width={[120,100,110,90,115,95][i]} height="5" rx="1.5" fill="#d0c8dc" opacity=".6"/>

        <rect x="12" y="132" width="62" height="62" rx="4" fill={bg} opacity=".35"/>
        <rect x="86" y="132" width="62" height="28" rx="4" fill={bg} opacity=".2"/>
        <rect x="86" y="166" width="62" height="28" rx="4" fill={bg} opacity=".2"/>
        {[208,216].map((y,i) => (
          <rect key={i} x="12" y={y} width={i===0?136:100} height="4" rx="1.5" fill="#d0c8dc" opacity=".5"/>

      </svg>
    </div>
  );
};

          <div style={{ height: 4, width: '85%', background: 'var(--ink-4)', borderRadius: 2, opacity: 0.3 }} />
          <div style={{ height: 4, width: '70%', background: 'var(--accent-2-soft)', borderRadius: 2 }} />
          <div style={{ height: 4, width: '80%', background: 'var(--ink-4)', borderRadius: 2, opacity: 0.3 }} />
        </div>
      </div>
    </div>
  );

  if (kind === 'theories') return (
    <div style={{ position: 'absolute', inset: 0, padding: 28, display: 'flex', flexWrap: 'wrap', gap: 8, alignContent: 'center', justifyContent: 'center', background: 'var(--bg-2)' }}>
      {Object.values(THEORIES).map((t, i) => (
        <span key={t.id} className={'chip ' + t.klass} style={{ fontSize: 12, padding: '7px 14px', opacity: 0.4 + (i % 5) * 0.12 }}>{t.label}</span>
      ))}
    </div>
  );

  if (kind === 'steps') return (
    <div style={{ position: 'absolute', inset: 0, padding: 28, display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 14, background: 'var(--bg-2)' }}>
      {[
        { n: 1, title: 'Describe', sub: 'Format + learners' },
        { n: 2, title: 'Choose',   sub: 'Template + theories' },
        { n: 3, title: 'Generate', sub: 'Word or PDF' },
      ].map(s => (
        <div key={s.n} style={{ background: 'var(--surface)', borderRadius: 10, padding: 16, border: '1px solid var(--border)', display: 'flex', flexDirection: 'column', gap: 6, justifyContent: 'space-between' }}>
          <div className="mono" style={{ fontSize: 10, color: 'var(--ink-3)' }}>STEP 0{s.n}</div>
          <div>
            <div className="serif" style={{ fontSize: 22 }}>{s.title}</div>
            <div style={{ fontSize: 11, color: 'var(--ink-3)' }}>{s.sub}</div>
          </div>
        </div>
      ))}
    </div>
  );

  if (kind === 'driver') return (
    <div style={{ position: 'absolute', inset: 0, padding: 28, background: 'var(--bg-2)', display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 10 }}>
      {[
        { q: 'What grade level?',         a: 'Grade 5 · mixed-ability', match: true },
        { q: 'How big is the class?',     a: '28 learners', match: true },
        { q: 'Any specific needs?',       a: 'Dyslexia, ADHD, EAL', match: true },
        { q: 'Apply which theories?',     a: 'UDL · Cognitive Load · Strengths', match: false },
      ].map((row, i) => (
        <div key={i} className="row" style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 8, padding: '10px 14px', justifyContent: 'space-between' }}>
          <span style={{ fontSize: 13, color: 'var(--ink-2)' }}>{row.q}</span>
          <span className="mono" style={{ fontSize: 11, color: row.match ? 'var(--accent)' : 'var(--accent-2)' }}>{row.a}</span>
        </div>
      ))}
    </div>
  );

  return null;
};

const WelcomeTour = ({ onClose, onDone }) => {
  const [idx, setIdx] = useState(0);
  const last = idx === TOUR_SLIDES.length - 1;
  const slide = TOUR_SLIDES[idx];
  return (
    <div className="scrim anim-fade" role="dialog" aria-modal="true">
      <div className="tour-modal">
        <div className="tour-art">
          <TourArt kind={slide.art} />
          <button className="btn ghost sm" onClick={onClose} style={{ position: 'absolute', top: 12, right: 12 }} aria-label="Skip">Skip tour</button>
        </div>
        <div className="tour-body">
          <div className="row between" style={{ alignItems: 'flex-end' }}>
            <div style={{ maxWidth: '52ch' }}>
              <div className="eyebrow mb-1">{`Welcome · 0${idx + 1} of 0${TOUR_SLIDES.length}`}</div>
              <h2 className="serif" style={{ fontSize: 28, marginBottom: 8 }}>{slide.title}</h2>
              <p style={{ margin: 0, fontSize: 14.5 }}>{slide.body}</p>
            </div>
            <div className="tour-dots" aria-hidden>
              {TOUR_SLIDES.map((_, i) => <span key={i} className={'tour-dot ' + (i === idx ? 'active' : '')} />)}
            </div>
          </div>
          <div className="row between mt-3">
            <Button variant="ghost" onClick={() => setIdx(Math.max(0, idx - 1))} disabled={idx === 0} leading="arrow-left">Back</Button>
            {last ? (
              <Button variant="accent" size="lg" onClick={onDone} trailing="arrow-right">Let’s begin</Button>
            ) : (
              <Button variant="primary" onClick={() => setIdx(idx + 1)} trailing="arrow-right">Next</Button>
            )}

        </div>
      </div>
    </div>
  );
};

function suggestedTheories(state) {
  const tpl = (TEMPLATES[state.tlm]||[]).find(t=>t.id===state.template);
  const base = new Set(tpl ? tpl.theories : ['udl']);
  const needs = state.needs||[];
  if (needs.includes('dyslexia')||needs.includes('vision')) base.add('udl');
  if (needs.includes('adhd')||needs.includes('autism')) base.add('cog');
  if (needs.includes('eal')) base.add('crp');
  if (needs.includes('systemic')||needs.includes('mental-health')) base.add('strengths');
  if (state.context==='rural-indigenous') base.add('indig');
  if (state.context==='capacity-building'||state.context==='higher-ed') base.add('knowles');
  const overrides = state.theoryOverrides||{};
  const final = new Set(base);
  Object.entries(overrides).forEach(([k,v])=>{ if(v===true) final.add(k); else if(v===false) final.delete(k); });
  return [...final];
}
function toggleTheory(state,set,id) {
  const cur = state.theoryOverrides||{};
  const on = suggestedTheories(state).includes(id);
  set({theoryOverrides:{...cur,[id]:!on}});
}

const UploadScreen = ({ state, set, onNext, onBack }) => {
  const [stage, setStage] = useState(state.uploaded?'mapped':'await');
  const [progress, setProgress] = useState(0);
  const [filename, setFilename] = useState(state.uploadedFilename||null);
  const [error, setError] = useState(null);

  const processFile = useCallback(async(file) => {
    setFilename(file.name);
    setError(null);
    setStage('uploading');
    setProgress(0);

    let text = '';
    try {
      if (file.name.endsWith('.docx') && window.mammoth) {
        const arrayBuffer = await file.arrayBuffer();
        const result = await mammoth.extractRawText({arrayBuffer});
        text = result.value;
      } else {
        text = await file.text();
      }
    } catch(e) {
      text = await file.text().catch(()=>'');
    }

    // Animate upload
    let p = 0;
    const tick = setInterval(()=>{
      p += 12 + Math.random()*16;
      setProgress(Math.min(95, p));
      if (p >= 95) clearInterval(tick);
    }, 120);

    await new Promise(r=>setTimeout(r, 900));
    clearInterval(tick);
    setProgress(100);
    setStage('analyzing');

    // Use Claude to map theories if text extracted, else fall back to demo
    const contentToAnalyze = text && text.trim().length > 50 ? text : SAMPLE_TLM.extractedText;
    set({ uploaded:true, uploadedFilename:file.name, uploadedText:contentToAnalyze });

    setTimeout(()=>{ setStage('mapped'); }, 1400);
  }, [set]);

  const handleFileInput = e => {
    const f = e.target.files?.[0];
    if (f) processFile(f);
  };

  const handleDrop = e => {
    e.preventDefault();
    const f = e.dataTransfer.files?.[0];
    if (f) processFile(f);
  };

  const useDemoSample = () => {
    setFilename(SAMPLE_TLM.filename);
    set({ uploaded:true, uploadedFilename:SAMPLE_TLM.filename, uploadedText:SAMPLE_TLM.extractedText });

  const theories = suggestedTheories(state);
  const gradeProfile = getGradeProfile(state.audience);
  const language = state.formData?.language || 'English';

  const steps = [
    'Reading your inputs…',
    `Calibrating for ${gradeProfile.label}…`,
    `Applying ${theories.length} frameworks: ${theories.slice(0,3).map(t=>THEORIES[t].short).join(', ')}${theories.length>3?'…':''}`,
    'Drafting sections with theory annotations…',
    language !== 'English' ? `Translating to ${language}…` : 'Formatting multi-modal supports…',
    'Adding margin notes and footer…',
    'Ready.',
  ];

  useEffect(() => {
    let cancelled = false;
    const runGeneration = async () => {
      try {
        // Animate steps while generating
        const animate = async () => {
          for (let i = 0; i < steps.length - 1; i++) {
            if (cancelled) return;
            setStep(i);
            await new Promise(r => setTimeout(r, i === 4 && language !== 'English' ? 1800 : 700));
          }
        };
        const animPromise = animate();

        // Build prompt
        const tplName = (TEMPLATES[state.tlm]||[]).find(t=>t.id===state.template)?.name || 'general';
        const needs = (state.needs||[]).map(n=>NEEDS.find(x=>x.id===n)?.label).filter(Boolean).join(', ');
        const uploadedContent = state.uploadedText || '';
        const formContent = state.formData?.content || '';
        const sourceContent = uploadedContent || formContent;
        const topic = state.formData?.topic || SAMPLE_TLM.title;
        const objective = state.formData?.objective || SAMPLE_TLM.objective;
        const concepts = state.formData?.concepts || '';
        const duration = state.formData?.duration || '45 min';

        const languageInstruction = language !== 'English'
          ? `IMPORTANT: Write the ENTIRE output in ${language}. Every word of the body text, section headings, bullet points, and notes must be in ${language}. Only keep theory tag codes (like [UDL], [BLOOM]) in English as labels.`
          : '';

        const prompt = `You are an expert inclusive education specialist. Create a complete, well-structured Teaching-Learning Material (TLM) of type "${tplName}" for the following context.

AUDIENCE: ${gradeProfile.label}
GRADE CONTEXT: ${gradeProfile.detail}
TOPIC: ${topic}
OBJECTIVE: ${objective}
KEY CONCEPTS: ${concepts || 'to be determined from topic'}
DURATION: ${duration}
LEARNER PROFILE: ${state.classSize||'mixed'} learners, ${state.composition||'heterogeneous'}, needs: ${needs||'general UDL'}, context: ${state.contextNote||CONTEXTS.find(c=>c.id===state.context)?.label||'classroom'}
THEORIES TO APPLY: ${theories.map(t=>THEORIES[t].label).join(', ')}
${sourceContent ? `ORIGINAL MATERIAL TO ADAPT:\n${sourceContent.slice(0,2000)}` : ''}

${languageInstruction}

RULES:
1. Vocabulary and sentence complexity MUST match ${gradeProfile.label} — do not over-simplify or over-complicate
2. Each section must have a theory tag in brackets, e.g. [UDL] or [BLOOM]
3. Use concrete, culture-relevant examples appropriate for the context
4. Include at least one multi-modal alternative (read/draw/listen/build) per activity section
5. End with an asset-based exit/reflection prompt (not "be ready to be called on")
6. Final line must be exactly: FOOTER: Inclusive Ed Lab©
7. CRITICAL: Do NOT use any markdown formatting — no asterisks (**bold**), no underscores (_italic_), no backticks. Write plain prose only. Use numbered or bulleted lists with a simple dash (- ) prefix only.

OUTPUT FORMAT (use these exact headings):
## TITLE: [title here]
## OBJECTIVE: [one-sentence objective]
## SECTION 1 — [section name] [THEORY_TAG]
[content]
## SECTION 2 — [section name] [THEORY_TAG]
[content]
(4–6 sections total)
## EXIT PROMPT [STRENGTHS]
[content]
## FOOTER: Inclusive Ed Lab©`;

        const result = await window.claude.complete({
          messages: [{ role: 'user', content: prompt }]
        });

        await animPromise;
        if (!cancelled) {
          setStep(steps.length - 1);
          const parsed = parseGeneratedContent(result, theories, state, language);
          setGenerated(parsed);
          set({ generatedContent: parsed });
          setTimeout(() => { if (!cancelled) onNext(); }, 600);
        }
      } catch (e) {
        if (!cancelled) {
          setError('Generation failed. Using structured template instead.');
          const fallback = buildFallback(state, theories);
          setGenerated(fallback);
          set({ generatedContent: fallback });
          setStep(steps.length - 1);
          setTimeout(() => onNext(), 1200);
        }
      }
    };
    runGeneration();
    return () => { cancelled = true; };
  }, []);

  return (
    <div className="anim-fade" style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'60vh'}}>
      <div style={{maxWidth:540,width:'100%',textAlign:'center'}}>
        <div style={{position:'relative',width:72,height:72,margin:'0 auto 24px'}}>
          <div style={{position:'absolute',inset:0,border:'2px solid var(--border)',borderTopColor:'var(--accent)',borderRadius:'50%'}} className="spin"/>
          <div style={{position:'absolute',inset:0,display:'grid',placeItems:'center',color:'var(--accent)'}}>
            <Icon name="sparkles" size={26}/>
          </div>
        </div>
        <h2 className="serif" style={{fontSize:28,marginBottom:14}}>Composing your adapted TLM…</h2>
        {error && <div style={{color:'#c2410c',fontSize:13,marginBottom:12}}>{error}</div>}
        <div className="col" style={{gap:8,marginTop:18}}>
          {steps.map((s,i)=>(
            <div key={i} className="row" style={{gap:10,fontSize:13.5,color:i<=step?'var(--ink)':'var(--ink-4)'}}>
              <div style={{width:16,display:'grid',placeItems:'center'}}>
                {i<step?<Icon name="check" size={13}/>:i===step?<span className="pulse">•</span>:<span style={{color:'var(--ink-4)'}}>·</span>}
              </div>
              <span>{s}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ── Markdown cleaner ─────────────────────────────────────────────────────────
function stripMd(text) {
  return (text||'')
    .replace(/\*\*(.+?)\*\*/g, '$1')   // **bold** → plain
    .replace(/\*(.+?)\*/g, '$1')        // *italic* → plain
    .replace(/__(.+?)__/g, '$1')        // __bold__ → plain
    .replace(/_(.+?)_/g, '$1')          // _italic_ → plain
    .replace(/`(.+?)`/g, '$1')          // `code` → plain
    .replace(/#{1,6}\s+/g, '')          // ## Heading → plain
    .trim();
}

// Convert markdown inline bold/italic to HTML spans (for Word export)
function mdToHtml(text) {
  return (text||'')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/__(.+?)__/g, '<strong>$1</strong>')
    .replace(/_(.+?)_/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/#{1,6}\s+/g, '');
}

// ── Parse Claude output ───────────────────────────────────────────────────────
function parseGeneratedContent(raw, theories, state, language) {
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let title = state.formData?.topic || SAMPLE_TLM.title;
  let objective = state.formData?.objective || SAMPLE_TLM.objective;
  const sections = [];
  let current = null;

  lines.forEach(line => {
    if (line.startsWith('## TITLE:')) {
      title = stripMd(line.replace('## TITLE:','').trim());
    } else if (line.startsWith('## OBJECTIVE:')) {
      objective = stripMd(line.replace('## OBJECTIVE:','').trim());
    } else if (line.startsWith('## SECTION')||line.startsWith('## EXIT')) {
      if (current) sections.push(current);
      // Extract theory from [TAG]
      const tagMatch = line.match(/\[([A-Z_]+)\]/);
      const theory = tagMatch ? (Object.keys(THEORIES).find(k=>THEORIES[k].short.toUpperCase()===tagMatch[1])||theories[0]||'udl') : (theories[0]||'udl');
      const sectionName = line.replace(/##\s*(SECTION \d+ —?|EXIT PROMPT)/,'').replace(/\[[A-Z_]+\]/,'').replace(/[—-]/,'').trim();
      current = {title: stripMd(sectionName||line.replace('##','').trim()), theory, body:[]};
    } else if (line.startsWith('## FOOTER')) {
      if (current) sections.push(current);
      current = null;
    } else if (current) {
      if (line.startsWith('- ')||line.startsWith('• ')) {
        const item = stripMd(line.replace(/^[-•]\s*/,''));
        const lastBlk = current.body[current.body.length-1];
        if (lastBlk&&lastBlk.kind==='list') lastBlk.items.push(item);
        else current.body.push({kind:'list',items:[item]});
      } else if (line.length > 0) {
        current.body.push({kind:'p',text:stripMd(line)});
      }
    }
  });
  if (current) sections.push(current);

  // Ensure at least 3 sections
  if (sections.length < 2) return buildFallback(state, theories);

  const gradeCtx = getGradeProfile(state.audience);
  const audience = AUDIENCES.find(a=>a.id===state.audience)?.label || '';
  return {
    title,
    objective,
    subtitle: `${(TEMPLATES[state.tlm]||[]).find(t=>t.id===state.template)?.name||''} · ${audience} · ${language!=='English'?language:''}`.replace(/·\s*$/,'').trim(),
    gradeLabel: gradeCtx.label,
    language,
    theories,
    sections: sections.slice(0,6),
  };
}

// ── Fallback content ──────────────────────────────────────────────────────────
function buildFallback(state, theories) {
  const topic = state.formData?.topic || SAMPLE_TLM.title;
  const objective = state.formData?.objective || SAMPLE_TLM.objective;
  const g = getGradeProfile(state.audience);
  const audience = AUDIENCES.find(a=>a.id===state.audience)?.label||'';
  const lang = state.formData?.language||'English';

  return {
    title: topic,
    objective,
    subtitle: `${audience} · ${g.label}`,
    gradeLabel: g.label,
    language: lang,
    theories,
    sections: [
      { title:'1 · Hook & connect', theory:'crp', body:[
        {kind:'p', text:`Open with a 90-second community story or familiar scenario related to ${topic}. Invite learners to share what they already know — in any language.`},
        {kind:'note', text:'Culturally relevant opener. Multilingual sharing welcomed.'},
      ]},
      { title:'2 · Pre-teach key concepts', theory:'vyg', body:[
        {kind:'p', text:`Introduce core vocabulary with a picture card, a gesture, and the written term. Pause for choral and partner repetition.`},
        {kind:'note', text:'I Do → We Do → You Do. Multi-sensory anchoring.'},
      ]},
      { title:'3 · Explore — your choice of path', theory:'udl', body:[
        {kind:'p', text:'Choose one path to engage with the concept:'},
        {kind:'list', items:['Path A: Read the short text and annotate it','Path B: Listen to the 3-minute audio explanation','Path C: Build or draw the concept using the materials provided']},
        {kind:'note', text:'Same objective. Three modalities. Learner-chosen.'},
      ]},
      { title:'4 · Make meaning', theory:'bloom', body:[
        {kind:'p', text:`Work through the thinking ladder for ${topic}:`},
        {kind:'list', items:['Name the key parts (Remember)','Explain in your own words to a partner (Understand)','Apply: What happens if one part is missing? (Apply)','Create: Design a way to explain this to someone younger (Create)']},
        {kind:'note', text:"Bloom's ladder embedded as the activity sequence."},
      ]},
      { title:'5 · Check & celebrate growth', theory:'strengths', body:[
        {kind:'p', text:'Exit prompt — pick one:'},
        {kind:'list', items:['One thing I now understand that I didn\'t before.','One question I\'m still curious about.','One way I would explain this to someone else.']},
        {kind:'note', text:'Asset-based prompts. No performance anxiety.'},
      ]},
    ],
  };
}

// ── PDF download (jsPDF) ───────────────────────────────────────────────────────
function downloadPDF(adapted) {
  if (!window.jspdf) throw new Error('jsPDF not loaded');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  const pageW = 210, lm = 20, rm = 20, usable = pageW - lm - rm;
  let y = 20;

  const addPage = () => { doc.addPage(); y = 20; };
  const checkPage = (needed=10) => { if (y > 272-needed) addPage(); };

  // Fonts (helvetica — closest to Glacial Indifference in jsPDF built-ins)
  // Header
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.setTextColor(153,136,170);
  doc.text('Inclusive Ed Lab©', lm, y);
  doc.text(`${adapted.gradeLabel||''} · ${adapted.language||'English'}`, pageW-rm, y, {align:'right'});
  doc.setDrawColor(232,224,240);
  doc.line(lm, y+2, pageW-rm, y+2);
  y += 10;

  // Title
  doc.setFont('helvetica','bold');
  doc.setFontSize(22);
  doc.setTextColor(13,13,13);
  const titleLines = doc.splitTextToSize(adapted.title, usable);
  doc.text(titleLines, lm, y);
  y += titleLines.length*8 + 4;

  // Subtitle
  if (adapted.subtitle) {
    doc.setFont('helvetica','normal');
    doc.setFontSize(9);
    doc.setTextColor(135,110,160);
    doc.text(adapted.subtitle, lm, y);
    y += 7;
  }

  // Objective box
  checkPage(20);
  doc.setFillColor(240,232,248);
  doc.setDrawColor(107,47,160);
  const objLines = doc.splitTextToSize(`Objective: ${adapted.objective}`, usable-14);
  doc.roundedRect(lm, y, usable, objLines.length*5+8, 2, 2, 'FD');
  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.setTextColor(85,36,126);
  doc.text(objLines, lm+7, y+7);
  y += objLines.length*5+14;

  // Sections
  (adapted.sections||[]).forEach(sec => {
    checkPage(30);
    doc.setFont('helvetica','bold');
    doc.setFontSize(12);
    doc.setTextColor(13,13,13);
    const sTitle = `${sec.title}  [${THEORIES[sec.theory]?.short||''}]`;
    doc.text(sTitle, lm, y);
    doc.setDrawColor(107,47,160);
    doc.setLineWidth(0.4);
    doc.line(lm, y+2, lm+doc.getTextWidth(sTitle), y+2);
    y += 8;

    sec.body?.forEach(blk => {
      if (blk.kind==='p') {
        checkPage(12);
        doc.setFont('helvetica','normal');
        doc.setFontSize(10);
        doc.setTextColor(26,26,26);
        const lines = doc.splitTextToSize(stripMd(blk.text), usable);
        doc.text(lines, lm, y);
        y += lines.length*5+3;
      } else if (blk.kind==='list') {
        blk.items?.forEach(item => {
          checkPage(8);
          doc.setFont('helvetica','normal');
          doc.setFontSize(10);
          doc.setTextColor(26,26,26);
          doc.text('•', lm, y);
          const lines = doc.splitTextToSize(stripMd(item), usable-8);
          doc.text(lines, lm+6, y);
          y += lines.length*5+2;
        });
      } else if (blk.kind==='note') {
        checkPage(8);
        doc.setFont('helvetica','italic');
        doc.setFontSize(8.5);
        doc.setTextColor(107,47,160);
        doc.setFillColor(240,232,248);
        const nLines = doc.splitTextToSize(`${THEORIES[sec.theory]?.short||''}: ${stripMd(blk.text)}`, usable-8);
        doc.roundedRect(lm, y-2, usable, nLines.length*4+6, 1.5, 1.5, 'F');
        doc.text(nLines, lm+4, y+3);
        y += nLines.length*4+8;
      }
    });
    y += 4;
  });

  // Footer
  checkPage(14);
  doc.setDrawColor(232,224,240);
  doc.line(lm, y+2, pageW-rm, y+2);
  y += 6;
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.setTextColor(153,136,170);
  doc.text('Inclusive Ed Lab©', lm, y);
  doc.text(new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}), pageW-rm, y, {align:'right'});

  doc.save(`${slugify(adapted.title)}.pdf`);
}

// ── Word download (HTML-to-.doc) ──────────────────────────────────────────────
function downloadWord(adapted) {
  const theoriesHtml = (adapted.theories||[]).map(id=>`<span style="background:#f0e8f8;color:#55247e;font-family:monospace;font-size:9pt;padding:2px 6px;border-radius:10px;margin-right:4px;text-transform:uppercase;letter-spacing:.05em">${THEORIES[id]?.short||id}</span>`).join('');

  const sectionsHtml = (adapted.sections||[]).map(sec => {
    const bodyHtml = (sec.body||[]).map(blk => {
      if (blk.kind==='p') return `<p style="margin:6px 0;font-size:11pt;line-height:1.65;color:#1a1a1a">${mdToHtml(blk.text)}</p>`;
      if (blk.kind==='list') return `<ul style="margin:6px 0 6px 20px;font-size:11pt;line-height:1.65">${(blk.items||[]).map(i=>`<li style="margin-bottom:4px">${mdToHtml(i)}</li>`).join('')}</ul>`;
      if (blk.kind==='note') return `<div style="font-size:9pt;color:#55247e;background:#f0e8f8;padding:5px 10px;border-radius:4px;margin:6px 0;font-style:italic">${THEORIES[sec.theory]?.short||''}: ${blk.text}</div>`;
      return '';
    }).join('');
    return `
      <h2 style="font-size:13pt;font-weight:700;color:#0d0d0d;margin-top:20px;margin-bottom:6px;border-bottom:1px solid #e8e0f0;padding-bottom:4px">
        ${sec.title} <span style="font-size:9pt;color:#6B2FA0;font-family:monospace">[${THEORIES[sec.theory]?.short||''}]</span>
      </h2>
      ${bodyHtml}`;
  }).join('');

  const html = `<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8">
<style>
  @import url('https://fonts.cdnfonts.com/css/glacial-indifference-2');
  body { font-family: 'Glacial Indifference', 'Nunito', Arial, sans-serif; margin: 2.5cm 2.5cm 2cm; color: #1a1a1a; font-size: 11pt; }
  h1 { font-family: 'Georgia', serif; color: #0d0d0d; font-size: 22pt; font-weight: 400; margin-bottom: 6pt; }
  h2 { color: #0d0d0d; }
  .header-bar { font-size: 8pt; color: #9988aa; border-bottom: 1pt solid #e8e0f0; padding-bottom: 6pt; margin-bottom: 14pt; display: flex; justify-content: space-between; }
  .objective-box { background: #f0e8f8; border-left: 3pt solid #6B2FA0; padding: 10pt 14pt; margin-bottom: 16pt; border-radius: 0 4pt 4pt 0; }
  .footer { color: #9988aa; font-size: 8pt; border-top: 1pt solid #e8e0f0; margin-top: 28pt; padding-top: 8pt; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="header-bar">
  <span>Inclusive Ed Lab©</span>
  <span>${adapted.gradeLabel||''} · ${adapted.language||'English'}</span>
</div>
<h1>${adapted.title}</h1>
${adapted.subtitle?`<p style="font-size:10pt;color:#8878a8;margin-bottom:14pt">${adapted.subtitle}</p>`:''}
<div class="objective-box">
  <strong style="color:#55247e">Objective.</strong> ${adapted.objective}
</div>
<div style="margin-bottom:16pt">${theoriesHtml}</div>
${sectionsHtml}
<div class="footer">
  <span>Inclusive Ed Lab©</span>
  <span>Generated ${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span>
</div>
</body></html>`;

  const blob = new Blob([html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${slugify(adapted.title)}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function slugify(s) {
  return (s||'untitled').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
}

// ── Wrapper: generation → output ──────────────────────────────────────────────
const OutputWithGen = ({ state, set, onBack, onRestart }) => {
  const [phase, setPhase] = useState('gen');
  if (phase==='gen') return <GenerationScreen state={state} set={set} onNext={()=>setPhase('done')} onBack={onBack}/>;
  return <OutputScreen state={state} set={set} onBack={onBack} onRestart={onRestart}/>;
};

Object.assign(window, { OutputWithGen, GenerationScreen, OutputScreen, downloadPDF, downloadWord });


// Claude API integration
window.claude = {
  complete: async function({ messages, system }) {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2000,
        system: system || 'You are an expert inclusive education specialist.',
        messages: messages
      })
    });
    if (!response.ok) throw new Error('API error ' + response.status);
    const data = await response.json();
    return data.content?.[0]?.text || '';
  }
};
// App — sidebar with Theory Library tab, updated color system, Tweaks

const { useState, useCallback } = React;

const STEPS = [
  {id:'intent',    label:'Describe'},
  {id:'templates', label:'Templates'},
  {id:'profile',   label:'Learners'},
  {id:'shortlist', label:'Shortlist'},
  {id:'build',     label:'Build'},
  {id:'detail',    label:'Details'},
  {id:'output',    label:'Output'},
];

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "density": "comfy",
  "accent": "#6B2FA0",
  "showSidebar": true,
  "showTour": false
}/*EDITMODE-END*/;

const App = () => {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  useEffect(() => {
    document.documentElement.dataset.theme = t.theme || 'light';
    document.documentElement.dataset.density = t.density || 'comfy';
    document.documentElement.style.setProperty('--accent', t.accent || '#6B2FA0');
  }, [t.theme, t.density, t.accent]);

  const [showTour, setShowTour] = useState(() => !localStorage.getItem('iel.toured.v2'));
  useEffect(() => { if (!showTour) localStorage.setItem('iel.toured.v2','1'); }, [showTour]);
  useEffect(() => { if (t.showTour) { setShowTour(true); setTweak('showTour', false); } }, [t.showTour]);

  const [showTheory, setShowTheory] = useState(false);

  const [state, setState] = useState({
    tlm:null, audience:null, template:null,
    persona:null, classSize:24, composition:null,
    needs:[], reading:null, context:null, contextNote:'',
    buildMode:null, formData:{}, uploaded:false,
    uploadedFilename:null, uploadedText:null,
    acceptedMappings:null, theoryOverrides:{},
    outputFormat:'docx', generatedContent:null,
  });
  const set = useCallback(patch => setState(s=>({...s,...patch})), []);

  const [stepIdx, setStepIdx] = useState(0);

  const isUnlocked = idx => {
    if (idx <= stepIdx) return true;
    if (idx===1) return !!state.tlm && !!state.audience;
    if (idx===2) return idx===stepIdx;
    if (idx===3) return !!state.composition && !!state.context;
    if (idx===4) return !!state.template;
    if (idx===5) return !!state.buildMode;
    if (idx===6) return state.buildMode==='upload' ? state.uploaded : !!(state.formData?.topic && state.formData?.objective);
    return false;
  };

  const restart = () => {
    setStepIdx(0);
    setState({tlm:null,audience:null,template:null,persona:null,classSize:24,composition:null,needs:[],reading:null,context:null,contextNote:'',buildMode:null,formData:{},uploaded:false,uploadedFilename:null,uploadedText:null,acceptedMappings:null,theoryOverrides:{},outputFormat:'docx',generatedContent:null});
  };

  const renderStep = () => {
    switch(STEPS[stepIdx].id) {
      case 'intent':    return <IntentScreen state={state} set={set} onNext={()=>setStepIdx(1)}/>;
      case 'templates': return <TemplateGalleryScreen state={state} set={set} onNext={()=>setStepIdx(2)} onBack={()=>setStepIdx(0)}/>;
      case 'profile':   return <ProfileScreen state={state} set={set} onNext={()=>setStepIdx(3)} onBack={()=>setStepIdx(1)}/>;
      case 'shortlist': return <ShortlistScreen state={state} set={set} onNext={()=>setStepIdx(4)} onBack={()=>setStepIdx(2)}/>;
      case 'build':     return <BuildPickerScreen state={state} set={set} onNext={()=>setStepIdx(5)} onBack={()=>setStepIdx(3)}/>;
      case 'detail':
        return state.buildMode==='upload'
          ? <UploadScreen state={state} set={set} onNext={()=>setStepIdx(6)} onBack={()=>setStepIdx(4)}/>
          : <EnterDetailsScreen state={state} set={set} onNext={()=>setStepIdx(6)} onBack={()=>setStepIdx(4)}/>;
      case 'output':    return <OutputWithGen state={state} set={set} onBack={()=>setStepIdx(5)} onRestart={restart}/>;
      default: return null;
    }
  };

  return (
    <div className="app-shell" data-screen-label="Inclusive Ed Lab">
      {t.showSidebar && (
        <Sidebar stepIdx={stepIdx} setStepIdx={setStepIdx} state={state}
          isUnlocked={isUnlocked} onReplayTour={()=>setShowTour(true)}
          onOpenTheory={()=>setShowTheory(true)}/>
      )}
      <div className="app-main">
        <TopBar stepIdx={stepIdx} state={state} setStepIdx={setStepIdx} onOpenTheory={()=>setShowTheory(true)}/>
        <div className="content">{renderStep()}</div>
      </div>

      {showTour && <WelcomeTour onClose={()=>setShowTour(false)} onDone={()=>setShowTour(false)}/>}
      {showTheory && <TheoryLibrary onClose={()=>setShowTheory(false)}/>}

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme"/>
        <TweakRadio label="Mode" value={t.theme} onChange={v=>setTweak('theme',v)} options={[{value:'light',label:'Light'},{value:'dark',label:'Dark'}]}/>
        <TweakColor label="Accent" value={t.accent} onChange={v=>setTweak('accent',v)} options={['#6B2FA0','#9b5fd0','#d97757','#4a7a8c','#2a6e48']}/>
        <TweakRadio label="Density" value={t.density} onChange={v=>setTweak('density',v)} options={[{value:'comfy',label:'Comfy'},{value:'compact',label:'Compact'}]}/>
        <TweakSection label="Navigation"/>
        <TweakToggle label="Show sidebar" value={t.showSidebar} onChange={v=>setTweak('showSidebar',v)}/>
        <TweakButton label="Replay welcome tour" onClick={()=>setShowTour(true)}/>
        <TweakButton label="Open Theory Library" onClick={()=>setShowTheory(true)}/>
        <TweakSection label="Jump to step"/>
        <TweakSelect label="Step" value={STEPS[stepIdx].id} onChange={v=>setStepIdx(STEPS.findIndex(s=>s.id===v))} options={STEPS.map(s=>({value:s.id,label:s.label}))}/>
      </TweaksPanel>
    </div>
  );
};

// ── Topbar ────────────────────────────────────────────────────────────────────
const TopBar = ({ stepIdx, state, setStepIdx, onOpenTheory }) => {
  const tlm = TLM_TYPES.find(t=>t.id===state.tlm);
  const tpl = state.template && (TEMPLATES[state.tlm]||[]).find(t=>t.id===state.template);
  const audience = AUDIENCES.find(a=>a.id===state.audience);
  return (
    <div className="topbar">
      <StepPills steps={STEPS.slice(0,5).map(s=>({id:s.id,label:s.label}))} current={Math.min(stepIdx,4)}/>
      <div style={{flex:1}}/>
      <div className="row" style={{gap:12,color:'var(--ink-3)',fontSize:12.5}}>
        {tlm && <span style={{fontWeight:600,color:'var(--ink-2)'}}>{tlm.label}</span>}
        {tpl && <><span>·</span><span>{tpl.name}</span></>}
        {audience && <><span>·</span><span>{audience.label}</span></>}
      </div>
      <button className="btn outline-accent sm" onClick={onOpenTheory} style={{gap:6}}>
        <Icon name="theory" size={13}/>
        Theory Library
      </button>
      <button className="btn ghost sm" title="Help"><Icon name="help" size={14}/></button>
    </div>
  );
};

// ── Sidebar ───────────────────────────────────────────────────────────────────
const Sidebar = ({ stepIdx, setStepIdx, state, isUnlocked, onReplayTour, onOpenTheory }) => {
  const activeTheories = state.tlm ? suggestedTheories(state) : [];

  return (
    <aside className="sidebar" data-screen-label="Sidebar">
      {/* Brand */}
      <div className="brand">
        <div className="brand-mark">i</div>
        <div className="brand-name">
          Inclusive Ed Lab
          <small>TLM Adapter</small>
        </div>
      </div>

      {/* Progress */}
      <div>
        <div className="sidebar-section-label mb-1">Your progress</div>
        <div className="progress-list">
          {STEPS.map((s,i) => {
            const cls = i===stepIdx?'active':i<stepIdx?'done':isUnlocked(i)?'':'locked';
            return (
              <div key={s.id} className={'progress-step '+cls}
                onClick={()=>isUnlocked(i)&&setStepIdx(i)}>
                <div className="step-bullet">{i<stepIdx?'✓':i+1}</div>
                <div>{s.label}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Theory Library button */}
      <div style={{borderTop:'1px solid var(--border)',paddingTop:14}}>
        <div className="sidebar-section-label mb-2">Resources</div>
        <button className="btn outline-accent" style={{width:'100%',justifyContent:'center',gap:8}} onClick={onOpenTheory}>
          <Icon name="theory" size={15}/>
          Theory Library
        </button>
        <p style={{fontSize:11.5,color:'var(--ink-3)',margin:'8px 4px 0',lineHeight:1.5}}>
          Visual guides to UDL, Bloom's, Vygotsky, Kolb, HCD and 8 more frameworks — with annotated TLM examples.
        </p>
      </div>

      {/* Theories in play */}
      {activeTheories.length > 0 && (
        <div className="surface-quiet" style={{padding:12}}>
          <div className="row" style={{gap:8,marginBottom:6}}>
            <Icon name="sparkles" size={14}/>
            <strong style={{fontSize:12}}>Theories in play</strong>
          </div>
          <div className="row" style={{gap:4,flexWrap:'wrap'}}>
            {activeTheories.slice(0,6).map(id=><TheoryChip key={id} id={id}/>)}
          </div>
        </div>
      )}

      {/* Footer */}
      <div className="sidebar-foot">
        <div className="row between mb-1">
          <span>Need a refresher?</span>
          <button className="btn ghost sm" onClick={onReplayTour} style={{padding:'3px 8px'}}>Tour</button>
        </div>
        <a href="Template Repository.html" target="_blank" style={{color:'var(--accent)',fontSize:12,textDecoration:'none',display:'block',marginBottom:6}}>
          → Browse all 66 templates
        </a>
        <div style={{fontSize:10.5,lineHeight:1.6}}>
          Built on UDL · Bloom's · Vygotsky · Sweller · Kolb · Knowles · Connectivism · HCD · Strengths · Self-Determination · CRP · Indigenous.
        </div>
      </div>
    </aside>
  );
};

// ── useEffect shim for Tweaks ─────────────────────────────────────────────────
const { useEffect } = React;

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
